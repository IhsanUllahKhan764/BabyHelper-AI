name: baby_helper_ai
description: "BabyHelper AI - Your Intelligent Infant Care Companion"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State Management
  provider: ^6.1.2

  # Navigation
  go_router: ^14.8.1

  # Firebase
  firebase_core: ^3.13.0
  firebase_auth: ^5.7.0
  cloud_firestore: ^5.6.9
  google_sign_in: ^6.2.2

  # AI / ML
  tflite_flutter: ^0.11.0

  # Audio
  record: ^5.2.1
  just_audio: ^0.9.43

  # Charts
  fl_chart: ^1.0.0

  # UI
  google_fonts: ^6.2.1
  shimmer: ^3.0.0
  cached_network_image: ^3.4.1
  flutter_svg: ^2.0.17

  # Utils
  intl: ^0.20.2
  path_provider: ^2.1.5
  permission_handler: ^11.4.0
  image_picker: ^1.1.2
  shared_preferences: ^2.5.3
  uuid: ^4.5.1

dependency_overrides:
  record_linux: ^1.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/models/
    - assets/images/
    - assets/icons/
    - assets/animations/

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  remove_alpha_ios: true
  image_path: "assets/icons/App Icon.png"
  min_sdk_android: 21
